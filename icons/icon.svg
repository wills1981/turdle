    <rect x="-122" y="-55" width="244" height="80" rx="40" fill="url(#poo)"/>
    <rect x="-160" y="10" width="320" height="96" rx="48" fill="url(#poo)"/>
    <!-- highlights -->
    <rect x="-60" y="-100" width="70" height="14" rx="7" fill="#b9784c" opacity=".7"/>
    <rect x="-100" y="-43" width="100" height="14" rx="7" fill="#b9784c" opacity=".7"/>
    <!-- face -->
    <circle cx="-48" cy="-12" r="26" fill="#fff"/><circle cx="48" cy="-12" r="26" fill="#fff"/>
    <circle cx="-42" cy="-8" r="12" fill="#2b170b"/><circle cx="54" cy="-8" r="12" fill="#2b170b"/>
    <path d="M -62 36 Q 0 92 62 36 Z" fill="#2b170b"/>
    <path d="M -46 40 Q 0 66 46 40 Z" fill="#fff"/>
